<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<title>INTHEMENTAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-base="">

<main class="home" id="home">
  <button class="intro" id="intro" type="button" aria-label="향 목록 열기">
    <span class="logo">
      <img src="assets/logo.png" alt="INTHEMENTAL" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
      <span class="logo-text" hidden aria-hidden="true">
        <span>IN</span><span>THE</span><span>MEN</span><span>TAL</span>
      </span>
    </span>
    <span class="hint">눌러서 향 고르기</span>
  </button>

  <nav class="menu" id="menu" aria-label="향 목록">
    <ul class="scent-list" id="scent-list"></ul>
  </nav>
</main>

<script src="assets/app.js" defer></script>
</body>
</html>
